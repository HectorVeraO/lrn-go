name: lrn-go

services:
  lrn-go-postgres:
    image: postgres:18-alpine
    container_name: lrn-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lrngo
    ports:
      - "10200:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  lrn-go-mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: lrn-go-mongodb
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: mongo
      MONGODB_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "10201:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
      - mongo_mongot:/data/mongot

volumes:
  postgres_data:
  mongo_data:
  mongo_configdb:
  mongo_mongot:
